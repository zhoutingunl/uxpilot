<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UX Pilot</title><link rel="stylesheet" href="/static/style.css"></head><body><header><a class="brand" href="/">UX Pilot</a><nav><a href="/jobs">任务</a><a href="/stats">统计</a><a href="/errors">工具错误</a><a href="/deploys">部署</a><a href="https://github.com/zhoutingunl/uxpilot" target="_blank" rel="noopener noreferrer">源代码</a></nav></header><main><section><h1>输入仓库和演示地址，自动完成体验评测</h1><p class="subtitle">后台异步运行浏览器 Agent，保存回放、视频、独立验收和源码候选。</p></section><form id="form" class="panel"><div class="grid-2"><div><label>代码仓库地址或本地目录</label><input id="repo" required placeholder="https://github.com/org/project.git"></div><div><label>线上演示地址</label><input id="url" required placeholder="https://demo.example.com/"></div></div><label>分支或标签（选填）</label><input id="ref" placeholder="留空使用默认分支"><label>可选体验目标</label><textarea id="goal" placeholder="例如：第一次使用者完成一次核心操作，并确认成功反馈"></textarea><fieldset class="device-options"><legend>测试设备</legend><label><input type="checkbox" name="devices" value="desktop" checked>桌面 Chrome</label><label><input type="checkbox" name="devices" value="android" checked>Android 触屏模拟</label><label><input type="checkbox" name="devices" value="iphone" disabled>iPhone / WebKit 模拟</label><p id="device-note" class="muted">每个任务会在所选设备上分别运行。手机选项为浏览器模拟，真机行为仍需复核。</p></fieldset><label for="coverage">测试策略</label><select id="coverage"><option value="stateful" selected>正常流程 + 中途切换、恢复与重试</option><option value="standard">正常流程</option></select><div class="grid"><div><label>任务数</label><input id="tasks" type="number" min="1" max="5" value="2"></div><div><label>重复次数</label><input id="repeats" type="number" min="1" max="3" value="1"></div><div><label>最大步骤</label><input id="max_steps" type="number" min="1" max="40" value="24"></div></div><label for="timeout">每个任务的时限（秒，包含模型等待）</label><input id="timeout" type="number" min="30" max="1800" value="600"><p id="error" class="status failed hidden"></p><button>提交评测</button></form><section class="panel"><h2>最近任务</h2><div id="recent" class="table-wrap">加载中…</div></section></main><script src="/static/app.js"></script></body></html>
