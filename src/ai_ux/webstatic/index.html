<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UX Pilot</title><link rel="stylesheet" href="/static/style.css"></head><body><header><a class="brand" href="/">UX Pilot</a><nav><a href="/jobs">任务</a><a href="/stats">统计</a><a href="/errors">工具错误</a><a href="/deploys">部署</a></nav></header><main><section><h1>输入仓库和演示地址，自动完成体验评测</h1><p class="subtitle">后台异步运行浏览器 Agent，保存回放、视频、独立验收和源码候选。</p></section><form id="form" class="panel"><div class="grid-2"><div><label>代码仓库地址或本地目录</label><input id="repo" required placeholder="https://github.com/org/project.git"></div><div><label>线上演示地址</label><input id="url" required placeholder="https://demo.example.com/"></div></div><label>可选体验目标</label><textarea id="goal" placeholder="例如：第一次使用者完成一次核心操作，并确认成功反馈"></textarea><div class="grid"><div><label>任务数</label><input id="tasks" type="number" min="1" max="5" value="2"></div><div><label>重复次数</label><input id="repeats" type="number" min="1" max="3" value="1"></div><div><label>最大步骤</label><input id="max_steps" type="number" min="1" max="30" value="12"></div></div><p id="error" class="status failed hidden"></p><button>提交评测</button></form><section class="panel"><h2>最近任务</h2><div id="recent" class="table-wrap">加载中…</div></section></main><script src="/static/app.js"></script></body></html>
