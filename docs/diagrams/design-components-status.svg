<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1540" viewBox="0 0 1600 1540" role="img" aria-labelledby="title desc"><title id="title">原设计实现状态 · 组件与技术选型</title><desc id="desc">按照现有代码标注已实现、部分实现、未实现和未采用，详情与依据见 design-implementation-status.md。</desc><rect width="100%" height="100%" fill="#f5f7fc"/><g font-family="Inter,Arial,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Noto Sans CJK SC&#x27;,sans-serif"><text x="36" y="58" font-size="32" fill="#263449" font-weight="750" text-anchor="start">原设计实现状态 · 组件与技术选型</text><text x="36" y="94" font-size="18" fill="#61718b" font-weight="400" text-anchor="start">能力可由不同技术实现；“未采用推荐项目”不等于“相关能力未实现”</text><text x="1564" y="132" font-size="16" fill="#61718b" font-weight="400" text-anchor="end">UX Pilot v0.2 · 2026-11-03</text><rect x="36" y="115" width="74" height="30" rx="15" fill="#e6f4eb" stroke="#e6f4eb"/><text x="49" y="135" font-size="16" fill="#18764f" font-weight="600" text-anchor="start">已实现</text><rect x="124" y="115" width="90" height="30" rx="15" fill="#fff3d8" stroke="#fff3d8"/><text x="137" y="135" font-size="16" fill="#94620c" font-weight="600" text-anchor="start">部分实现</text><rect x="228" y="115" width="74" height="30" rx="15" fill="#fff0ef" stroke="#fff0ef"/><text x="241" y="135" font-size="16" fill="#b8433e" font-weight="600" text-anchor="start">未实现</text><rect x="316" y="115" width="74" height="30" rx="15" fill="#edf0f5" stroke="#edf0f5"/><text x="329" y="135" font-size="16" fill="#68738a" font-weight="600" text-anchor="start">未采用</text><text x="412" y="136" font-size="16" fill="#61718b" font-weight="400" text-anchor="start">依据代码状态标注；未采用 ≠ 能力缺失</text><rect x="36" y="180" width="1528" height="56" rx="10" fill="#eaf0f8" stroke="#dce5f1"/><text x="56" y="216" font-size="21" fill="#263449" font-weight="700" text-anchor="start">组件</text><text x="285" y="216" font-size="21" fill="#263449" font-weight="700" text-anchor="start">原推荐项目</text><text x="600" y="216" font-size="21" fill="#263449" font-weight="700" text-anchor="start">实现状态</text><text x="940" y="216" font-size="21" fill="#263449" font-weight="700" text-anchor="start">当前实现 / 差异</text><rect x="36" y="246" width="1528" height="126" rx="10" fill="white" stroke="#dfe6f1"/><text x="56" y="288" font-size="21" fill="#263449" font-weight="650" text-anchor="start">自主操作浏览器</text><text x="285" y="288" font-size="21" fill="#263449" font-weight="400" text-anchor="start">Browser Use</text><rect x="600" y="265" width="189.04" height="30" rx="15" fill="#e7f0fc" stroke="#e7f0fc"/><text x="613" y="285" font-size="16" fill="#265b9c" font-weight="600" text-anchor="start">能力已实现 · 库未采用</text><text x="600" y="326" font-size="17" fill="#61718b" font-weight="400" text-anchor="start">技术方案与原推荐不同</text><text x="940" y="285" font-size="18" fill="#61718b" font-weight="400" text-anchor="start">自建 LLM Explorer + Playwright，按目标自主操作。</text><text x="940" y="312" font-size="18" fill="#61718b" font-weight="400" text-anchor="start">没有 browser-use 依赖或集成。</text><rect x="36" y="384" width="1528" height="126" rx="10" fill="#fbfcff" stroke="#dfe6f1"/><text x="56" y="426" font-size="21" fill="#263449" font-weight="650" text-anchor="start">浏览器证据采集</text><text x="285" y="426" font-size="21" fill="#263449" font-weight="400" text-anchor="start">Playwright</text><rect x="600" y="403" width="90" height="30" rx="15" fill="#fff3d8" stroke="#fff3d8"/><text x="613" y="423" font-size="16" fill="#94620c" font-weight="600" text-anchor="start">部分实现</text><text x="940" y="423" font-size="18" fill="#61718b" font-weight="400" text-anchor="start">截图、视频、事件、请求 / HTTP 错误、资源计时、warning/error。</text><text x="940" y="450" font-size="18" fill="#61718b" font-weight="400" text-anchor="start">未实现 Trace / HAR；没有全量 HTTP 与 Console 录制。</text><rect x="36" y="522" width="1528" height="126" rx="10" fill="white" stroke="#dfe6f1"/><text x="56" y="564" font-size="21" fill="#263449" font-weight="650" text-anchor="start">UX 评审</text><text x="285" y="564" font-size="21" fill="#263449" font-weight="400" text-anchor="start">LLM + 自定义 Judge</text><rect x="600" y="541" width="74" height="30" rx="15" fill="#e6f4eb" stroke="#e6f4eb"/><text x="613" y="561" font-size="16" fill="#18764f" font-weight="600" text-anchor="start">已实现</text><text x="940" y="561" font-size="18" fill="#61718b" font-weight="400" text-anchor="start">GLM-5.3 Flash 主模型，MiniMax-M3.1 Flash 备用。</text><text x="940" y="588" font-size="18" fill="#61718b" font-weight="400" text-anchor="start">独立上下文、原生视频审查、证据校验与修改候选。</text><rect x="36" y="660" width="1528" height="126" rx="10" fill="#fbfcff" stroke="#dfe6f1"/><text x="56" y="702" font-size="21" fill="#263449" font-weight="650" text-anchor="start">结构化结果</text><text x="285" y="702" font-size="21" fill="#263449" font-weight="400" text-anchor="start">Pydantic</text><rect x="600" y="679" width="74" height="30" rx="15" fill="#e6f4eb" stroke="#e6f4eb"/><text x="613" y="699" font-size="16" fill="#18764f" font-weight="600" text-anchor="start">已实现</text><text x="940" y="699" font-size="18" fill="#61718b" font-weight="400" text-anchor="start">配置、任务、动作、Judge 和源码定位结果类型化。</text><text x="940" y="726" font-size="18" fill="#61718b" font-weight="400" text-anchor="start">模型 JSON 校验失败时有上限地重试。</text><rect x="36" y="798" width="1528" height="126" rx="10" fill="white" stroke="#dfe6f1"/><text x="56" y="840" font-size="21" fill="#263449" font-weight="650" text-anchor="start">修复 Agent</text><text x="285" y="840" font-size="21" fill="#263449" font-weight="400" text-anchor="start">Codex CLI</text><rect x="600" y="817" width="74" height="30" rx="15" fill="#fff0ef" stroke="#fff0ef"/><text x="613" y="837" font-size="16" fill="#b8433e" font-weight="600" text-anchor="start">未实现</text><text x="940" y="837" font-size="18" fill="#61718b" font-weight="400" text-anchor="start">目前只有只读源码定位与修改建议。</text><text x="940" y="864" font-size="18" fill="#61718b" font-weight="400" text-anchor="start">没有调用 Codex CLI、修改代码、修复分支或 PR。</text><rect x="36" y="936" width="1528" height="126" rx="10" fill="#fbfcff" stroke="#dfe6f1"/><text x="56" y="978" font-size="21" fill="#263449" font-weight="650" text-anchor="start">工作流</text><text x="285" y="978" font-size="21" fill="#263449" font-weight="400" text-anchor="start">Python + GitLab CI</text><rect x="600" y="955" width="213.84" height="30" rx="15" fill="#fff3d8" stroke="#fff3d8"/><text x="613" y="975" font-size="16" fill="#94620c" font-weight="600" text-anchor="start">部分实现 · GitLab 未采用</text><text x="600" y="1016" font-size="16" fill="#61718b" font-weight="400" text-anchor="start">Python ✓   GitHub Actions ✓</text><text x="940" y="975" font-size="18" fill="#61718b" font-weight="400" text-anchor="start">Python 串行编排与状态保存已实现；实际为 GitHub Actions。</text><text x="940" y="1002" font-size="18" fill="#61718b" font-weight="400" text-anchor="start">CI 仅测试 / 覆盖率 / 构建；未自动触发部署后的 UX eval。</text><rect x="36" y="1074" width="1528" height="126" rx="10" fill="white" stroke="#dfe6f1"/><text x="56" y="1116" font-size="21" fill="#263449" font-weight="650" text-anchor="start">可选替代方案</text><text x="285" y="1116" font-size="21" fill="#263449" font-weight="400" text-anchor="start">Stagehand</text><rect x="600" y="1093" width="74" height="30" rx="15" fill="#edf0f5" stroke="#edf0f5"/><text x="613" y="1113" font-size="16" fill="#68738a" font-weight="600" text-anchor="start">未采用</text><text x="940" y="1113" font-size="18" fill="#61718b" font-weight="400" text-anchor="start">没有集成该库或混合执行适配器。</text><text x="940" y="1140" font-size="18" fill="#61718b" font-weight="400" text-anchor="start">当前由自建 Explorer 操作循环承担。</text><rect x="36" y="1212" width="1528" height="126" rx="10" fill="#fbfcff" stroke="#dfe6f1"/><text x="56" y="1254" font-size="21" fill="#263449" font-weight="650" text-anchor="start">可选 Agent 平台</text><text x="285" y="1254" font-size="21" fill="#263449" font-weight="400" text-anchor="start">OpenHands</text><rect x="600" y="1231" width="74" height="30" rx="15" fill="#edf0f5" stroke="#edf0f5"/><text x="613" y="1251" font-size="16" fill="#68738a" font-weight="600" text-anchor="start">未采用</text><text x="940" y="1251" font-size="18" fill="#61718b" font-weight="400" text-anchor="start">没有接入其多 Agent 执行与管理平台。</text><text x="940" y="1278" font-size="18" fill="#61718b" font-weight="400" text-anchor="start">当前角色以独立 LLM 请求和串行任务组织。</text><rect x="36" y="1358" width="1528" height="122" rx="14" fill="#2b3b57" stroke="#2b3b57"/><text x="58" y="1396" font-size="22" fill="white" font-weight="700" text-anchor="start">最需避免的误读</text><text x="58" y="1428" font-size="19" fill="#edf2fa" font-weight="400" text-anchor="start">自建探索循环 ≠ Browser Use 集成；报告 / 源码建议 ≠ Codex 修复闭环；CI 测试 ≠ 线上 UX 自动触发。</text><text x="58" y="1458" font-size="18" fill="#d8e2f2" font-weight="400" text-anchor="start">已有 severity / confidence 建议，不代表实现了数值评分体系或完成了人工校准。</text><text x="1564" y="1517" font-size="15" fill="#61718b" font-weight="400" text-anchor="end">依据：pyproject.toml · src/ai_ux · .github/workflows/ci.yml</text></g></svg>