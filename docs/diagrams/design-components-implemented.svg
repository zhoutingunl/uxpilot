<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">已实现组件 · 实际技术与用途</title><desc id="desc">UX Pilot 当前已实现能力与实际技术，16:9 横版。</desc><rect width="100%" height="100%" fill="#f5f7fc"/><g font-family="Inter,Arial,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Noto Sans CJK SC&#x27;,sans-serif"><text x="36" y="59" font-size="34" fill="#263449" font-weight="750" text-anchor="start">已实现组件 · 实际技术与用途</text><text x="36" y="97" font-size="20" fill="#61718b" font-weight="400" text-anchor="start">展示当前采用的技术，以及已落地的功能范围</text><rect x="36" y="119" width="111" height="30" rx="15" fill="#e6f4eb" stroke="#e6f4eb"/><text x="49" y="139" font-size="17" fill="#18764f" font-weight="600" text-anchor="start">已实现能力</text><text x="1564" y="139" font-size="17" fill="#61718b" font-weight="400" text-anchor="end">UX Pilot v0.2 · 已实现能力</text><rect x="36" y="173" width="1528" height="51" rx="10" fill="#eaf0f8" stroke="#dfe6f1"/><text x="56" y="207" font-size="24" fill="#263449" font-weight="700" text-anchor="start">组件</text><text x="335" y="207" font-size="24" fill="#263449" font-weight="700" text-anchor="start">实际采用技术</text><text x="865" y="207" font-size="24" fill="#263449" font-weight="700" text-anchor="start">已实现用途</text><rect x="36" y="234" width="1528" height="94" rx="10" fill="white" stroke="#dfe6f1"/><text x="56" y="273" font-size="23" fill="#263449" font-weight="650" text-anchor="start">自主操作浏览器</text><text x="335" y="272" font-size="22" fill="#263449" font-weight="400" text-anchor="start">自建 LLM Explorer + Playwright</text><text x="865" y="268" font-size="20" fill="#61718b" font-weight="400" text-anchor="start">根据自然语言目标与当前页面观察自主决策</text><text x="865" y="298" font-size="20" fill="#61718b" font-weight="400" text-anchor="start">以观察到的控件 ID 执行有界 UI 操作</text><rect x="36" y="339" width="1528" height="94" rx="10" fill="#fbfcff" stroke="#dfe6f1"/><text x="56" y="378" font-size="23" fill="#263449" font-weight="650" text-anchor="start">浏览器证据采集</text><text x="335" y="377" font-size="22" fill="#263449" font-weight="400" text-anchor="start">Playwright + 自建 Evidence / Media</text><text x="865" y="373" font-size="20" fill="#61718b" font-weight="400" text-anchor="start">截图、无声录屏、事件与视频时间映射</text><text x="865" y="403" font-size="20" fill="#61718b" font-weight="400" text-anchor="start">请求 / HTTP 错误、资源计时及 Console warning/error</text><rect x="36" y="444" width="1528" height="94" rx="10" fill="white" stroke="#dfe6f1"/><text x="56" y="483" font-size="23" fill="#263449" font-weight="650" text-anchor="start">UX 评审</text><text x="335" y="482" font-size="22" fill="#263449" font-weight="400" text-anchor="start">GLM-5.3 Flash / MiniMax-M3.1 Flash</text><text x="865" y="478" font-size="20" fill="#61718b" font-weight="400" text-anchor="start">独立 Judge 原生视频评审与证据分析</text><text x="865" y="508" font-size="20" fill="#61718b" font-weight="400" text-anchor="start">给出修改候选、严重度、复现步骤和验收条件</text><rect x="36" y="549" width="1528" height="94" rx="10" fill="#fbfcff" stroke="#dfe6f1"/><text x="56" y="588" font-size="23" fill="#263449" font-weight="650" text-anchor="start">结构化结果</text><text x="335" y="587" font-size="22" fill="#263449" font-weight="400" text-anchor="start">Pydantic</text><text x="865" y="583" font-size="20" fill="#61718b" font-weight="400" text-anchor="start">配置、任务、动作、Judge 与源码定位结果类型化</text><text x="865" y="613" font-size="20" fill="#61718b" font-weight="400" text-anchor="start">JSON Schema 校验与有限重试</text><rect x="36" y="654" width="1528" height="94" rx="10" fill="white" stroke="#dfe6f1"/><text x="56" y="693" font-size="23" fill="#263449" font-weight="650" text-anchor="start">工作流与工程验证</text><text x="335" y="692" font-size="22" fill="#263449" font-weight="400" text-anchor="start">Python + GitHub Actions</text><text x="865" y="688" font-size="20" fill="#61718b" font-weight="400" text-anchor="start">Python 串行编排、状态保存、重复运行与重评</text><text x="865" y="718" font-size="20" fill="#61718b" font-weight="400" text-anchor="start">GitHub Actions 执行 lint、离线测试、覆盖率和构建</text><rect x="36" y="780" width="1528" height="65" rx="13" fill="#2b3b57" stroke="#2b3b57"/><text x="58" y="821" font-size="23" fill="white" font-weight="600" text-anchor="start">报告链路：自主体验 → 证据采集 → 独立验收 → 视频 Judge → 源码候选 → 人工复核</text><text x="1564" y="880" font-size="16" fill="#61718b" font-weight="400" text-anchor="end">当前实现视图 · 详细能力与代码依据见 docs/design-implementation-status.md</text></g></svg>