1h6M12 4V1m0 7v6l4 2"/></g><text x="94" y="441" font-size="25" fill="#263449" font-weight="700" text-anchor="start">执行控制</text><text x="58" y="482" font-size="21" fill="#61718b" font-weight="400" text-anchor="start">串行任务 / 重复运行 / 预算</text><text x="58" y="512" font-size="21" fill="#61718b" font-weight="400" text-anchor="start">停止、超时、清理与重评</text><rect x="36" y="574" width="493.333" height="160" rx="14" fill="white" stroke="#dfe6f1"/><g transform="translate(58,598) scale(0.958333)" fill="none" stroke="#2e73d7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 2 15 11-7 1-3 7z"/><path d="m12 14 5 7"/></g><text x="94" y="619" font-size="25" fill="#263449" font-weight="700" text-anchor="start">Explorer Agent</text><text x="58" y="660" font-size="21" fill="#61718b" font-weight="400" text-anchor="start">task / persona 可配置 · 默认首次使用者</text><text x="58" y="690" font-size="21" fill="#61718b" font-weight="400" text-anchor="start">观察页面与截图 → 选择一个动作 → 核对反馈</text><path d="M533.333 480h16m-5-5 5 5-5 5" fill="none" stroke="#aab6c8" stroke-width="2"/><text x="553.333" y="195" font-size="25" fill="#159cac" font-weight="700" text-anchor="start">Playwright + Browser Runtime</text><rect x="553.333" y="218" width="493.333" height="160" rx="14" fill="white" stroke="#dfe6f1"/><g transform="translate(575.333,242) scale(0.958333)" fill="none" stroke="#159cac" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 2 15 11-7 1-3 7z"/><path d="m12 14 5 7"/></g><text x="611.333" y="263" font-size="25" fill="#263449" font-weight="700" text-anchor="start">真实浏览器操作</text><text x="575.333" y="304" font-size="21" fill="#61718b" font-weight="400" text-anchor="start">点击 / 输入 / 选择 / 键盘</text><text x="575.333" y="334" font-size="21" fill="#61718b" font-weight="400" text-anchor="start">滚动 / 等待 / 导航 / 刷新</text><rect x="553.333" y="396" width="493.333" height="160" rx="14" fill="white" stroke="#dfe6f1"/><g transform="translate(575.333,420) scale(0.958333)" fill="none" stroke="#159cac" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="14" height="14" rx="3"/><path d="m16 10 6-4v12l-6-4"/></g><text x="611.333" y="441" font-size="25" fill="#263449" font-weight="700" text-anchor="start">截图、视频与事件</text><text x="575.333" y="482" font-size="21" fill="#61718b" font-weight="400" text-anchor="start">视口截图 / 无声录屏</text><text x="575.333" y="512" font-size="21" fill="#61718b" font-weight="400" text-anchor="start">events.jsonl + 时间映射</text><rect x="553.333" y="574" width="493.333" height="160" rx="14" fill="white" stroke="#dfe6f1"/><g transform="translate(575.333,598) scale(0.958333)" fill="none" stroke="#159cac" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><ellipse cx="12" cy="12" rx="4" ry="10"/><path d="M2 12h20"/></g><text x="611.333" y="619" font-size="25" fill="#263449" font-weight="700" text-anchor="start">错误与资源观测</text><text x="575.333" y="660" font-size="21" fill="#61718b" font-weight="400" text-anchor="start">请求 / HTTP 错误、资源计时</text><text x="575.333" y="690" font-size="21" fill="#61718b" font-weight="400" text-anchor="start">Console warning/error、pageerror</text><path d="M1050.67 480h16m-5-5 5 5-5 5" fill="none" stroke="#aab6c8" stroke-width="2"/><text x="1070.67" y="195" font-size="25" fill="#8056da" font-weight="700" text-anchor="start">独立验收 + UX Judge</text><rect x="1070.67" y="218" width="493.333" height="160" rx="14" fill="white" stroke="#dfe6f1"/><g transform="translate(1092.67,242) scale(0.958333)" fill="none" stroke="#8056da" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m7 12 3 3 7-7"/></g><text x="1128.67" y="263" font-size="25" fill="#263449" font-weight="700" text-anchor="start">独立确定性验收</text><text x="1092.67" y="304" font-size="21" fill="#61718b" font-weight="400" text-anchor="start">同运行旁路检查页面与业务条件</text><text x="1092.67" y="334" font-size="21" 