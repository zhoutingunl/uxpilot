<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1536" viewBox="0 0 1600 1536" role="img" aria-labelledby="title desc"><title id="title">原设计实现状态 · 角色与执行架构</title><desc id="desc">按照现有代码标注已实现、部分实现、未实现和未采用，详情与依据见 design-implementation-status.md。</desc><rect width="100%" height="100%" fill="#f5f7fc"/><g font-family="Inter,Arial,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Noto Sans CJK SC&#x27;,sans-serif"><text x="36" y="58" font-size="32" fill="#263449" font-weight="750" text-anchor="start">原设计实现状态 · 角色与执行架构</text><text x="36" y="94" font-size="18" fill="#61718b" font-weight="400" text-anchor="start">基于当前代码核对；角色名称、评审维度和实际专用 Agent 分开判断</text><text x="1564" y="132" font-size="16" fill="#61718b" font-weight="400" text-anchor="end">UX Pilot v0.2 · 2026-11-03</text><rect x="36" y="115" width="74" height="30" rx="15" fill="#e6f4eb" stroke="#e6f4eb"/><text x="49" y="135" font-size="16" fill="#18764f" font-weight="600" text-anchor="start">已实现</text><rect x="124" y="115" width="90" height="30" rx="15" fill="#fff3d8" stroke="#fff3d8"/><text x="137" y="135" font-size="16" fill="#94620c" font-weight="600" text-anchor="start">部分实现</text><rect x="228" y="115" width="74" height="30" rx="15" fill="#fff0ef" stroke="#fff0ef"/><text x="241" y="135" font-size="16" fill="#b8433e" font-weight="600" text-anchor="start">未实现</text><rect x="316" y="115" width="74" height="30" rx="15" fill="#edf0f5" stroke="#edf0f5"/><text x="329" y="135" font-size="16" fill="#68738a" font-weight="600" text-anchor="start">未采用</text><text x="412" y="136" font-size="16" fill="#61718b" font-weight="400" text-anchor="start">依据代码状态标注；未采用 ≠ 能力缺失</text><rect x="36" y="177" width="1528" height="255" rx="16" fill="white" stroke="#dfe6f1"/><text x="58" y="216" font-size="24" fill="#263449" font-weight="700" text-anchor="start">任务规划、角色调度、执行控制</text><text x="1542" y="216" font-size="16" fill="#61718b" font-weight="400" text-anchor="end">原设计的编排层</text><rect x="58" y="239" width="484" height="170" rx="10" fill="#fbfcfe" stroke="#dfe6f1"/><rect x="58" y="251" width="3" height="146" rx="1" fill="#18764f" stroke="#18764f"/><text x="74" y="270" font-size="20" fill="#263449" font-weight="650" text-anchor="start">任务规划</text><rect x="74" y="284" width="74" height="30" rx="15" fill="#e6f4eb" stroke="#e6f4eb"/><text x="87" y="304" font-size="16" fill="#18764f" font-weight="600" text-anchor="start">已实现</text><text x="74" y="340" font-size="17" fill="#61718b" font-weight="400" text-anchor="start">仓库文档 + 首页观察 → 用户目标 / project.yaml</text><rect x="558" y="239" width="484" height="170" rx="10" fill="#fbfcfe" stroke="#dfe6f1"/><rect x="558" y="251" width="3" height="146" rx="1" fill="#b8433e" stroke="#b8433e"/><text x="574" y="270" font-size="20" fill="#263449" font-weight="650" text-anchor="start">角色调度</text><rect x="574" y="284" width="74" height="30" rx="15" fill="#fff0ef" stroke="#fff0ef"/><text x="587" y="304" font-size="16" fill="#b8433e" font-weight="600" text-anchor="start">未实现</text><text x="574" y="340" font-size="17" fill="#61718b" font-weight="400" text-anchor="start">无三类角色注册、自动分配、并行调度或结果对照</text><rect x="1058" y="239" width="484" height="170" rx="10" fill="#fbfcfe" stroke="#dfe6f1"/><rect x="1058" y="251" width="3" height="146" rx="1" fill="#18764f" stroke="#18764f"/><text x="1074" y="270" font-size="20" fill="#263449" font-weight="650" text-anchor="start">执行控制</text><rect x="1074" y="284" width="74" height="30" rx="15" fill="#e6f4eb" stroke="#e6f4eb"/><text x="1087" y="304" font-size="16" fill="#18764f" font-weight="600" text-anchor="start">已实现</text><text x="1074" y="340" font-size="17" fill="#61718b" font-weight="400" text-anchor="start">串行任务 / 重复运行 / 步数与超时 / 清理与重评</text><path d="M800.0 447v28m-7-7 7 7 7-7" fill="none" stroke="#aab6c8" stroke-width="2.5" stroke-linecap="round"/><rect x="36" y="491" width="1528" height="273" rx="16" fill="white" stroke="#dfe6f1"/><text x="58" y="532" font-size="24" fill="#263449" font-weight="700" text-anchor="start">体验角色</text><text x="1542" y="532" font-size="16" fill="#61718b" font-weight="400" text-anchor="end">当前只有一个 Explorer + 可配置 persona</text><rect x="58" y="555" width="484" height="187" rx="10" fill="#fbfcfe" stroke="#dfe6f1"/><rect x="58" y="567" width="3" height="163" rx="1" fill="#94620c" stroke="#94620c"/><text x="74" y="586" font-size="20" fill="#263449" font-weight="650" text-anchor="start">新手 Agent</text><rect x="74" y="600" width="90" height="30" rx="15" fill="#fff3d8" stroke="#fff3d8"/><text x="87" y="620" font-size="16" fill="#94620c" font-weight="600" text-anchor="start">部分实现</text><text x="74" y="660" font-size="18" fill="#61718b" font-weight="600" text-anchor="start">首次使用体验</text><text x="74" y="693" font-size="17" fill="#61718b" font-weight="400" text-anchor="start">默认新手 persona + 同一个 Explorer</text><text x="74" y="718" font-size="17" fill="#61718b" font-weight="400" text-anchor="start">已有自主探索；无独立新手策略与角色验证</text><rect x="558" y="555" width="484" height="187" rx="10" fill="#fbfcfe" stroke="#dfe6f1"/><rect x="558" y="567" width="3" height="163" rx="1" fill="#b8433e" stroke="#b8433e"/><text x="574" y="586" font-size="20" fill="#263449" font-weight="650" text-anchor="start">熟练 Agent</text><rect x="574" y="600" width="74" height="30" rx="15" fill="#fff0ef" stroke="#fff0ef"/><text x="587" y="620" font-size="16" fill="#b8433e" font-weight="600" text-anchor="start">未实现</text><text x="574" y="660" font-size="18" fill="#61718b" font-weight="600" text-anchor="start">效率与一致性</text><text x="574" y="693" font-size="17" fill="#61718b" font-weight="400" text-anchor="start">没有专用熟练 Agent 或角色路径基线</text><text x="574" y="718" font-size="17" fill="#61718b" font-weight="400" text-anchor="start">Judge 有评价维度，可手工配置任务 / persona</text><rect x="1058" y="555" width="484" height="187" rx="10" fill="#fbfcfe" stroke="#dfe6f1"/><rect x="1058" y="567" width="3" height="163" rx="1" fill="#b8433e" stroke="#b8433e"/><text x="1074" y="586" font-size="20" fill="#263449" font-weight="650" text-anchor="start">异常 Agent</text><rect x="1074" y="600" width="74" height="30" rx="15" fill="#fff0ef" stroke="#fff0ef"/><text x="1087" y="620" font-size="16" fill="#b8433e" font-weight="600" text-anchor="start">未实现</text><text x="1074" y="660" font-size="18" fill="#61718b" font-weight="600" text-anchor="start">错误与恢复</text><text x="1074" y="693" font-size="17" fill="#61718b" font-weight="400" text-anchor="start">没有异常角色调度或产品故障注入引擎</text><text x="1074" y="718" font-size="17" fill="#61718b" font-weight="400" text-anchor="start">已有错误留证、重试 / 回退与重新评审</text><path d="M800.0 779v28m-7-7 7 7 7-7" fill="none" stroke="#aab6c8" stroke-width="2.5" stroke-linecap="round"/><rect x="36" y="822" width="1528" height="227" rx="16" fill="white" stroke="#dfe6f1"/><text x="58" y="863" font-size="24" fill="#263449" font-weight="700" text-anchor="start">Playwright + Browser Runtime</text><text x="1542" y="863" font-size="16" fill="#61718b" font-weight="400" text-anchor="end">操作与证据分项标注</text><rect x="58" y="883" width="359" height="143" rx="10" fill="#fbfcfe" stroke="#dfe6f1"/><rect x="58" y="895" width="3" height="119" rx="1" fill="#18764f" stroke="#18764f"/><text x="74" y="914" font-size="20" fill="#263449" font-weight="650" text-anchor="start">真实浏览器操作</text><rect x="74" y="928" width="74" height="30" rx="15" fill="#e6f4eb" stroke="#e6f4eb"/><text x="87" y="948" font-size="16" fill="#18764f" font-weight="600" text-anchor="start">已实现</text><text x="74" y="984" font-size="17" fill="#61718b" font-weight="400" text-anchor="start">Playwright + 自建 BrowserRuntime</text><rect x="433" y="883" width="359" height="143" rx="10" fill="#fbfcfe" stroke="#dfe6f1"/><rect x="433" y="895" width="3" height="119" rx="1" fill="#18764f" stroke="#18764f"/><text x="449" y="914" font-size="20" fill="#263449" font-weight="650" text-anchor="start">截图 / 视频 / 事件</text><rect x="449" y="928" width="74" height="30" rx="15" fill="#e6f4eb" stroke="#e6f4eb"/><text x="462" y="948" font-size="16" fill="#18764f" font-weight="600" text-anchor="start">已实现</text><text x="449" y="984" font-size="17" fill="#61718b" font-weight="400" text-anchor="start">视口截图、无声 MP4、events.jsonl</text><rect x="808" y="883" width="359" height="143" rx="10" fill="#fbfcfe" stroke="#dfe6f1"/><rect x="808" y="895" width="3" height="119" rx="1" fill="#b8433e" stroke="#b8433e"/><text x="824" y="914" font-size="20" fill="#263449" font-weight="650" text-anchor="start">Playwright Trace</text><rect x="824" y="928" width="74" height="30" rx="15" fill="#fff0ef" stroke="#fff0ef"/><text x="837" y="948" font-size="16" fill="#b8433e" font-weight="600" text-anchor="start">未实现</text><text x="824" y="984" font-size="17" fill="#61718b" font-weight="400" text-anchor="start">未启动 tracing；无 trace.zip</text><rect x="1183" y="883" width="359" height="143" rx="10" fill="#fbfcfe" stroke="#dfe6f1"/><rect x="1183" y="895" width="3" height="119" rx="1" fill="#94620c" stroke="#94620c"/><text x="1199" y="914" font-size="20" fill="#263449" font-weight="650" text-anchor="start">网络 / Console</text><rect x="1199" y="928" width="90" height="30" rx="15" fill="#fff3d8" stroke="#fff3d8"/><text x="1212" y="948" font-size="16" fill="#94620c" font-weight="600" text-anchor="start">部分实现</text><text x="1199" y="984" font-size="17" fill="#61718b" font-weight="400" text-anchor="start">错误与计时；不是全量 HAR / 日志</text><path d="M800.0 1064v28m-7-7 7 7 7-7" fill="none" stroke="#aab6c8" stroke-width="2.5" stroke-linecap="round"/><rect x="36" y="1107" width="1528" height="227" rx="16" fill="white" stroke="#dfe6f1"/><text x="58" y="1148" font-size="24" fill="#263449" font-weight="700" text-anchor="start">UX Judge Agent + 报告聚合</text><text x="1542" y="1148" font-size="16" fill="#61718b" font-weight="400" text-anchor="end">Judge 评审；Python 去重</text><rect x="58" y="1168" width="359" height="143" rx="10" fill="#fbfcfe" stroke="#dfe6f1"/><rect x="58" y="1180" width="3" height="119" rx="1" fill="#18764f" stroke="#18764f"/><text x="74" y="1199" font-size="20" fill="#263449" font-weight="650" text-anchor="start">发现体验问题</text><rect x="74" y="1213" width="74" height="30" rx="15" fill="#e6f4eb" stroke="#e6f4eb"/><text x="87" y="1233" font-size="16" fill="#18764f" font-weight="600" text-anchor="start">已实现</text><text x="74" y="1269" font-size="17" fill="#61718b" font-weight="400" text-anchor="start">独立上下文读取真实轨迹与视频</text><rect x="433" y="1168" width="359" height="143" rx="10" fill="#fbfcfe" stroke="#dfe6f1"/><rect x="433" y="1180" width="3" height="119" rx="1" fill="#18764f" stroke="#18764f"/><text x="449" y="1199" font-size="20" fill="#263449" font-weight="650" text-anchor="start">分析证据</text><rect x="449" y="1213" width="74" height="30" rx="15" fill="#e6f4eb" stroke="#e6f4eb"/><text x="462" y="1233" font-size="16" fill="#18764f" font-weight="600" text-anchor="start">已实现</text><text x="449" y="1269" font-size="17" fill="#61718b" font-weight="400" text-anchor="start">JSON Schema + 证据引用检查</text><rect x="808" y="1168" width="359" height="143" rx="10" fill="#fbfcfe" stroke="#dfe6f1"/><rect x="808" y="1180" width="3" height="119" rx="1" fill="#94620c" stroke="#94620c"/><text x="824" y="1199" font-size="20" fill="#263449" font-weight="650" text-anchor="start">去重</text><rect x="824" y="1213" width="90" height="30" rx="15" fill="#fff3d8" stroke="#fff3d8"/><text x="837" y="1233" font-size="16" fill="#94620c" font-weight="600" text-anchor="start">部分实现</text><text x="824" y="1269" font-size="17" fill="#61718b" font-weight="400" text-anchor="start">Python 精确标题聚合；无语义去重</text><rect x="1183" y="1168" width="359" height="143" rx="10" fill="#fbfcfe" stroke="#dfe6f1"/><rect x="1183" y="1180" width="3" height="119" rx="1" fill="#94620c" stroke="#94620c"/><text x="1199" y="1199" font-size="20" fill="#263449" font-weight="650" text-anchor="start">评分</text><rect x="1199" y="1213" width="90" height="30" rx="15" fill="#fff3d8" stroke="#fff3d8"/><text x="1212" y="1233" font-size="16" fill="#94620c" font-weight="600" text-anchor="start">部分实现</text><text x="1199" y="1269" font-size="17" fill="#61718b" font-weight="400" text-anchor="start">P0–P3 + 置信度；无数值 UX 总分</text><rect x="36" y="1358" width="1528" height="116" rx="14" fill="#2b3b57" stroke="#2b3b57"/><text x="58" y="1395" font-size="20" fill="#eef2fa" font-weight="600" text-anchor="start">当前是一个按 task/persona 配置的 Explorer；不是三个独立角色 Agent 的调度平台。</text><text x="58" y="1429" font-size="18" fill="#eef2fa" font-weight="400" text-anchor="start">已运行的报告链路：体验 → 独立验收 → 视频 Judge → 源码候选 → 人工复核。</text><text x="1564" y="1510" font-size="15" fill="#61718b" font-weight="400" text-anchor="end">核对范围：用户提供的角色 / 执行设计截图 · 依据见 docs/design-implementation-status.md</text></g></svg>