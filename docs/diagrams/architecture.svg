<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">UX Pilot 16:9 横版分层架构</title><desc id="desc">顶部七步流程，下方三列九层架构，底部当前能力边界；适合横版幻灯片。</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L5 3L0 6" fill="none" stroke="#61718B" stroke-width="1.1"/></marker></defs><rect width="100%" height="100%" fill="#F5F7FC"/><g font-family="Arial,&#x27;PingFang SC&#x27;,&#x27;Microsoft YaHei&#x27;,&#x27;Noto Sans CJK SC&#x27;,sans-serif"><text x="72" y="117" font-size="72" fill="#263449" font-weight="700" text-anchor="start" data-box="72,45,1300,88">UX Pilot · 分层架构</text><text x="74" y="162" font-size="28" fill="#61718B" font-weight="400" text-anchor="start" data-box="74,134,1450,38">仓库 + 演示地址 → 自主体验 → 视频评审 → 源码修改候选</text><text x="1846" y="96" font-size="26" fill="#61718B" font-weight="400" text-anchor="end" data-box="1510,70,336,40">v0.2 · 当前实现</text><rect x="72" y="198" width="236.571" height="68" rx="12" fill="#FFFFFF" stroke="#DFE6F1"/><text x="190.286" y="242" font-size="31" fill="#263449" font-weight="700" text-anchor="middle" data-box="82.0,211,216.57142857142858,43">接入项目</text><path d="M311.571 232L325.571 232" fill="none" stroke="#61718B" stroke-width="2" marker-end="url(#arrow)"/><rect x="328.571" y="198" width="236.571" height="68" rx="12" fill="#FFFFFF" stroke="#DFE6F1"/><text x="446.857" y="242" font-size="31" fill="#263449" font-weight="700" text-anchor="middle" data-box="338.57142857142856,211,216.57142857142858,43">规划任务</text><path d="M568.143 232L582.143 232" fill="none" stroke="#61718B" stroke-width="2" marker-end="url(#arrow)"/><rect x="585.143" y="198" width="236.571" height="68" rx="12" fill="#FFFFFF" stroke="#DFE6F1"/><text x="703.429" y="242" font-size="31" fill="#263449" font-weight="700" text-anchor="middle" data-box="595.1428571428571,211,216.57142857142858,43">自主体验</text><path d="M824.714 232L838.714 232" fil