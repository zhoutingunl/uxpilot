63449" font-weight="400" text-anchor="start" data-box="700,457,520,38">精简视频 + 显式时间映射</text><text x="700" y="516" font-size="20" fill="#61718B" font-weight="400" text-anchor="start" data-box="700,496,520,22">evidence.py · media.py</text><rect x="676" y="541" width="568" height="176" rx="18" fill="#FFFFFF" stroke="#DFE6F1"/><text x="700" y="597" font-size="40" fill="#159CAC" font-weight="700" text-anchor="start" data-box="700,557,520,49">05  验证与评审层</text><text x="700" y="641" font-size="28" fill="#263449" font-weight="400" text-anchor="start" data-box="700,613,520,38">同运行确定性验收 + 独立 Judge</text><text x="700" y="679" font-size="28" fill="#263449" font-weight="400" text-anchor="start" data-box="700,651,520,38">事实 / 推断 / 建议 · 证据校验</text><text x="700" y="710" font-size="20" fill="#61718B" font-weight="400" text-anchor="start" data-box="700,690,520,22">verifier.py · agent.py · schema.py</text><rect x="676" y="735" width="568" height="176" rx="18" fill="#FFFFFF" stroke="#DFE6F1"/><text x="700" y="791" font-size="40" fill="#159CAC" font-weight="700" text-anchor="start" data-box="700,751,520,49">06  AI 能力层</text><text x="700" y="835" font-size="28" fill="#263449" font-weight="400" text-anchor="start" data-box="700,807,520,38">GLM-5.3 Flash → MiniMax 备用</text><text x="700" y="873" font-size="28" fill="#263449" font-weight="400" text-anchor="start" data-box="700,845,520,38">原生视频输入 · 有限重试 / 回退</text><text x="700" y="904" font-size="20" fill="#61718B" font-weight="400" text-anchor="start" data-box="700,884,520,22">llm.py · defaults.py · probe.py</text><text x="1280" y="322" font-size="30" fill="#8056DA" font-weight="700" text-anchor="start" data-box="1280,292,568,42">源码、交付与工程质量</text><rect x="1280" y="347" width="568" height="176" rx="18" fill="#FFFFFF" stroke="#DFE6F1"/><text x="1304" y="403" font-size="40" fill="#8056DA" font-weight="700" text-anchor="start" data-box="1304,363,520,49">07  源码定位层</text><text x="1304" y="447" font-size="28" fill="#263449" font-weight="400" text-anchor="start" data-box="1304,419,520,38">评审后检索相关代码片段</text><text x="1304" y="485" font-size="28" fill="#263449" font-weight="400" text-anchor="start" data-box="1304,457,520,38">核验路径 / 行号 / 引用原文</text><text x="1304" y="516" font-size="20" fill="#61718B" font-weight="400" text-anchor="start" data-box="1304,496,520,22">repository.py · source_map.py</text><rect x="1280" y="541" width="568" height="176" rx="18" fill="#FFFFFF" stroke="#DFE6F1"/><text x="1304" y="597" font-size="40" fill="#8056DA" font-weight="700" text-anchor="start" data-box="1304,557,520,49">08  报告与复核层</text><text x="1304" y="641" font-size="28" fill="#263449" font-weight="400" text-anchor="start" data-box="1304,613,520,38">FastAPI 工作台 / 报告 / JSON</text><text x="1304" y="679" font-size="28" fill="#263449" font-weight="400" text-anchor="start" data-box="1304,651,520,38">分析回放 · 精确去重 · 验收条件</text><text x="1304" y="710" font-size="20" fill="#61718B" font-weight="400" text-anchor="start" data-box="1304,690,520,22">report.py · agent.py</text><rect x="1280" y="735" width="568" height="176" rx="18" fill="#FFFFFF" stroke="#DFE6F1"/><text x="1304" y="791" font-size="40" fill="#8056DA" font-weight="700" text-anchor="start" data-box="1304,751,520,49">09  策略与质量层</text><text x="1304" y="835" font-size="28" fill="#263449" font-weight="400" text-anchor="start" data-box="1304,807,520,38">SQLite 异步队列 / 错误聚类 / 统计</text><text x="1304" y="873" font-size="28" fill="#263449" font-weight="400" text-anchor="start" data-box="1304,845,520,38">部署记录 · 测试 · CI 覆盖率</text><text x="1304" y="904" font-size="20" fill="#61718B" font-weight="400" text-anchor="start" data-box="1304,884,520,22">policy.py · tests/ · GitHub Actions</text><rect x="72" y="940" width="1776" height="68" rx="12" fill="#263449" stroke="#263449"/><text x="94" y="981" font-size="28" fill="#FFFFFF" font-weight="700" text-anchor="start" data-box="94,953,1725,43">当前交付：体验报告与源码修改候选；三类角色调度、Trace、Codex 修复闭环尚未实现。</text><text x="74" y="1047" font-size="22" fill="#61718B" font-weight="400" text-anchor="start" data-box="74,1025,1300,30">逻辑分层，非独立服务；单次候选需人工复核；页面健康不等于业务成功。</text><text x="1846" y="1047" font-size="22" fill="#61718B" font-weight="400" text-anchor="end" data-box="1380,1025,466,30">github.com/zhoutingunl/uxpilot</text></g></svg>