[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uxpilot"
version = "0.2.0"
description = "Repository-aware browser UX evaluation with evidence and native video review"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.11,<3", "PyYAML>=6,<7", "playwright==1.64.1"]

[project.scripts]
uxpilot = "ai_ux.cli:main"
ai-ux = "ai_ux.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=7.1.0",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.hatch.build.targets.wheel]
packages = ["src/ai_ux"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.urls]
Repository = "https://github.com/zhoutingunl/uxpilot"
Issues = "https://github.com/zhoutingunl/uxpilot/issues"

[tool.coverage.run]
branch = true
source = ["ai_ux"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
